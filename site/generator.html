<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generator - Proximity UI</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
.gen { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; padding-block: 36px 80px }
@media (max-width: 980px) { .gen { grid-template-columns: 1fr } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px }
.panel h3 { margin: 0 0 12px; font: 600 13px var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--mute) }
.tree { display: flex; flex-direction: column; gap: 4px; font-size: 14px }
.node { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 9px; cursor: pointer; border: 1px solid transparent }
.node:hover { background: var(--card2) }
.node.sel { border-color: var(--fg); background: var(--card2) }
.node .k { font: 11px var(--mono); color: var(--mute); width: 62px; flex: none }
.node .x { margin-left: auto; opacity: 0; color: var(--mute); border: 0; background: none; cursor: pointer; font-size: 15px }
.node:hover .x { opacity: 1 }
.lvl1 { margin-left: 14px } .lvl2 { margin-left: 28px }
.adds { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px }
.adds button, .mini { border: 1px solid var(--line2); background: var(--card2); color: var(--fg); border-radius: 8px; padding: 6px 10px; font: 600 12.5px var(--body); cursor: pointer }
.adds button:hover, .mini:hover { border-color: var(--fg) }
.form { display: grid; gap: 10px; margin-top: 14px }
.form label { display: grid; gap: 4px; font-size: 12.5px; color: var(--dim) }
.form input, .form select { background: var(--bg2); border: 1px solid var(--line2); color: var(--fg); border-radius: 8px; padding: 8px 10px; font: 14px var(--body) }
.right { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; min-width: 0 }
.right > * { min-width: 0 }
/* the preview imitates the in-game window */
.pv { display: grid; grid-template-columns: 170px 1fr; height: 420px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line2); background: #060607; font-size: 13px }
.pv .side { background: #09090a; border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px }
.pv .bt { display: flex; gap: 8px; align-items: center; font-weight: 700; margin: 2px 4px 14px }
.pv .bt img { width: 22px; height: 22px; border-radius: 50% }
.pv .tb { padding: 7px 10px; border-radius: 7px; color: var(--dim); cursor: pointer; position: relative }
.pv .tb.on { background: #111113; color: #fff }
.pv .tb.on::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px; background: #fff; border-radius: 2px }
.pv .main { padding: 14px; overflow: auto }
.pv .head { font: 600 15px var(--body); margin: 0 4px 12px }
.pv .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.pv .sec { background: #0c0c0d; border: 1px solid #1e1e22; border-radius: 8px; padding: 10px; align-self: start }
.pv .sec.full { grid-column: 1 / -1 }
.pv .sec b { display: block; font-size: 10.5px; letter-spacing: .1em; color: #98989f; margin-bottom: 6px }
.pv .row { display: flex; align-items: center; justify-content: space-between; padding: 7px 2px; color: #d6d6da }
.pv .sw { width: 30px; height: 16px; border-radius: 99px; background: #17171a; border: 1px solid #303036; position: relative }
.pv .sw.on { background: #fff }
.pv .sw::after { content: ""; position: absolute; top: 2px; left: 3px; width: 10px; height: 10px; border-radius: 50%; background: #98989f }
.pv .sw.on::after { left: 15px; background: #08080a }
.pv .sl { height: 4px; border-radius: 4px; background: #17171a; margin: 2px 2px 6px; position: relative }
.pv .sl i { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; border-radius: 4px }
.pv .dd { border: 1px solid #1e1e22; background: #17171a; border-radius: 5px; padding: 2px 9px; font-size: 12px; color: #fff }
.pv .bn { border: 1px solid #1e1e22; background: #17171a; border-radius: 6px; text-align: center; padding: 6px; margin: 4px 0 }
.pv .kb { font: 11px var(--mono); border: 1px solid #1e1e22; background: #17171a; border-radius: 5px; padding: 1px 7px }
.pv .cp { width: 26px; height: 14px; border-radius: 4px; border: 1px solid #303036 }
@media (max-width: 560px) { .pv { grid-template-columns: 1fr } .pv .side { display: none } .pv .cols { grid-template-columns: 1fr } }
</style>
</head>
<body>
<div class="wrap">
  <div style="padding-top:44px">
    <span class="eyebrow">Tool</span>
    <h1 style="font:600 clamp(30px,5vw,46px)/1.1 var(--display);margin:10px 0 8px">Code generator</h1>
    <p style="color:var(--dim);max-width:62ch;margin:0">Click a menu together on the left, see it on the right and copy a ready Lua script. Your work is kept in this browser.</p>
  </div>
  <div class="gen">
    <div class="panel">
      <h3>Structure</h3>
      <div class="tree" id="tree"></div>
      <div class="adds" id="adds"></div>
      <div class="form" id="form"></div>
    </div>
    <div class="right">
      <div class="pv" id="preview"></div>
      <div>
        <div style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap">
          <h3 style="margin:0;font:600 13px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--mute)">Lua</h3>
          <span style="display:flex;gap:8px"><button class="mini" id="reset">Start over</button><button class="btn primary" id="copy" style="padding:9px 16px">Copy script</button></span>
        </div>
        <pre><code class="lua" id="code"></code></pre>
      </div>
    </div>
  </div>
</div>
<script src="assets/app.js"></script>
<script>
const KINDS = {
  Toggle: { f: ["Name", "Flag", "Icon", "Default:bool", "Keybind"] },
  Slider: { f: ["Name", "Flag", "Icon", "Min:num", "Max:num", "Default:num", "Suffix"] },
  Dropdown: { f: ["Name", "Flag", "Values", "Default", "Multi:bool"] },
  Button: { f: ["Name", "Icon", "Style:Secondary|Primary|Ghost|Danger"] },
  Keybind: { f: ["Name", "Flag", "Default", "Mode:Toggle|Hold|Always|Release|Press"] },
  ColorPicker: { f: ["Name", "Flag", "Default"] },
  Input: { f: ["Name", "Flag", "Placeholder"] },
  Label: { f: ["Text"] },
  PlayerList: { f: ["Height:num"] },
};
const fresh = () => ({ title: "My Hub", key: "RightShift", keySystem: false, settings: true, home: true, tabs: [
  { name: "Combat", icon: "aimbot", sections: [
    { name: "Aim", side: "Left", toggle: true, items: [
      { kind: "Toggle", Name: "Silent aim", Flag: "aim.silent", Icon: "silent", Default: false, Keybind: "Ctrl+X" },
      { kind: "Slider", Name: "FOV", Flag: "aim.fov", Icon: "fov", Min: 10, Max: 500, Default: 135, Suffix: " px" },
      { kind: "Dropdown", Name: "Part", Flag: "aim.part", Values: "Head, Torso", Default: "Head", Multi: false } ] },
    { name: "Weapon", side: "Right", items: [
      { kind: "Toggle", Name: "Auto reload", Flag: "weapon.reload", Default: true },
      { kind: "Button", Name: "Rejoin", Icon: "rejoin", Style: "Primary" } ] } ] },
  { name: "Visuals", icon: "esp", sections: [
    { name: "ESP", side: "Left", items: [
      { kind: "Toggle", Name: "Boxes", Flag: "esp.box", Default: true },
      { kind: "ColorPicker", Name: "Box color", Flag: "esp.box.color", Default: "#FFFFFF" } ] } ] } ] });
let st; try { st = JSON.parse(localStorage.getItem("proximity-gen")) } catch (e) {} st = st || fresh();
let sel = { t: 0, s: 0, i: -1 }, tabView = 0;
const save = () => { try { localStorage.setItem("proximity-gen", JSON.stringify(st)) } catch (e) {} };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const lua = s => '"' + String(s ?? "").replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';

function tree() {
  const el = document.getElementById("tree"); el.innerHTML = "";
  const node = (cls, k, label, pick, del) => {
    const d = document.createElement("div"); d.className = "node " + cls; d.innerHTML = `<span class="k">${k}</span><span>${esc(label)}</span>${del ? '<button class="x" aria-label="Remove">×</button>' : ""}`;
    d.onclick = e => { if (e.target.classList.contains("x")) { del(); } else pick(); render(); }; return d;
  };
  el.appendChild(node(sel.t === -1 ? "sel" : "", "window", st.title, () => (sel = { t: -1, s: -1, i: -1 })));
  st.tabs.forEach((t, ti) => {
    el.appendChild(node(sel.t === ti && sel.s === -1 ? "sel" : "", "tab", t.name, () => { sel = { t: ti, s: -1, i: -1 }; tabView = ti; }, () => { st.tabs.splice(ti, 1); sel = { t: -1, s: -1, i: -1 }; tabView = 0; }));
    t.sections.forEach((s, si) => {
      el.appendChild(node("lvl1 " + (sel.t === ti && sel.s === si && sel.i === -1 ? "sel" : ""), "section", s.name, () => { sel = { t: ti, s: si, i: -1 }; tabView = ti; }, () => { t.sections.splice(si, 1); sel = { t: ti, s: -1, i: -1 }; }));
      s.items.forEach((it, ii) => el.appendChild(node("lvl2 " + (sel.t === ti && sel.s === si && sel.i === ii ? "sel" : ""), it.kind.toLowerCase(), it.Name || it.Text || it.kind, () => { sel = { t: ti, s: si, i: ii }; tabView = ti; }, () => { s.items.splice(ii, 1); sel.i = -1; })));
    });
  });
}
function adds() {
  const el = document.getElementById("adds"); el.innerHTML = "";
  const btn = (label, fn) => { const b = document.createElement("button"); b.textContent = label; b.onclick = () => { fn(); render(); }; el.appendChild(b); };
  btn("+ Tab", () => { st.tabs.push({ name: "Tab " + (st.tabs.length + 1), icon: "layers", sections: [] }); sel = { t: st.tabs.length - 1, s: -1, i: -1 }; tabView = sel.t; });
  if (sel.t >= 0) btn("+ Section", () => { const t = st.tabs[sel.t]; t.sections.push({ name: "Section", side: t.sections.length % 2 ? "Right" : "Left", items: [] }); sel = { t: sel.t, s: t.sections.length - 1, i: -1 }; });
  if (sel.t >= 0 && sel.s >= 0) Object.keys(KINDS).forEach(k => btn("+ " + k, () => { const s = st.tabs[sel.t].sections[sel.s]; const it = { kind: k, Name: k }; if (k === "Label") it.Text = "Text"; if (k === "Slider") Object.assign(it, { Min: 0, Max: 100, Default: 50 }); if (k === "Dropdown") Object.assign(it, { Values: "One, Two" }); s.items.push(it); sel.i = s.items.length - 1; }));
}
function form() {
  const el = document.getElementById("form"); el.innerHTML = "";
  const field = (label, value, set, type) => {
    const l = document.createElement("label"); l.textContent = label;
    let input;
    if (type && type.includes("|")) { input = document.createElement("select"); type.split("|").forEach(o => input.add(new Option(o, o))); input.value = value || type.split("|")[0]; }
    else if (type === "bool") { input = document.createElement("select"); input.add(new Option("false", "false")); input.add(new Option("true", "true")); input.value = String(!!value); }
    else { input = document.createElement("input"); input.value = value ?? ""; if (type === "num") input.type = "number"; }
    input.oninput = input.onchange = () => { set(type === "bool" ? input.value === "true" : type === "num" ? Number(input.value) : input.value); save(); tree(); preview(); code(); };
    l.appendChild(input); el.appendChild(l);
  };
  if (sel.t === -1) {
    field("Title", st.title, v => (st.title = v)); field("Menu key", st.key, v => (st.key = v));
    field("Key system", st.keySystem, v => (st.keySystem = v), "bool"); field("Home tab", st.home, v => (st.home = v), "bool"); field("Settings tab", st.settings, v => (st.settings = v), "bool");
  } else if (sel.s === -1) {
    const t = st.tabs[sel.t]; field("Name", t.name, v => (t.name = v)); field("Icon", t.icon, v => (t.icon = v));
  } else if (sel.i === -1) {
    const s = st.tabs[sel.t].sections[sel.s]; field("Name", s.name, v => (s.name = v)); field("Side", s.side, v => (s.side = v), "Left|Right|Full"); field("Toggle in header", s.toggle, v => (s.toggle = v), "bool");
  } else {
    const it = st.tabs[sel.t].sections[sel.s].items[sel.i];
    KINDS[it.kind].f.forEach(spec => { const [k, t] = spec.split(":"); field(k, it[k], v => (it[k] = v), t); });
  }
}
function preview() {
  const t = st.tabs[tabView] || st.tabs[0];
  const pv = document.getElementById("preview");
  const tabs = st.tabs.map((x, i) => `<div class="tb ${x === t ? "on" : ""}" data-i="${i}">${esc(x.name)}</div>`).join("");
  const item = it => {
    if (it.kind === "Toggle") return `<div class="row"><span>${esc(it.Name)}</span><span style="display:flex;gap:6px;align-items:center">${it.Keybind ? `<span class="kb">${esc(it.Keybind)}</span>` : ""}<span class="sw ${it.Default ? "on" : ""}"></span></span></div>`;
    if (it.kind === "Slider") { const p = Math.max(0, Math.min(1, ((it.Default ?? 0) - (it.Min ?? 0)) / (((it.Max ?? 100) - (it.Min ?? 0)) || 1))); return `<div class="row"><span>${esc(it.Name)}</span><span class="kb" style="border:0;background:none">${esc(it.Default)}${esc(it.Suffix || "")}</span></div><div class="sl"><i style="width:${p * 100}%"></i></div>`; }
    if (it.kind === "Dropdown") return `<div class="row"><span>${esc(it.Name)}</span><span class="dd">${esc(it.Default || "None")} ▾</span></div>`;
    if (it.kind === "Button") return `<div class="bn" style="${it.Style === "Primary" ? "background:#fff;color:#000" : it.Style === "Danger" ? "color:#e84c54;border-color:#e84c54" : ""}">${esc(it.Name)}</div>`;
    if (it.kind === "Keybind") return `<div class="row"><span>${esc(it.Name)}</span><span class="kb">${esc(it.Default || "None")}</span></div>`;
    if (it.kind === "ColorPicker") return `<div class="row"><span>${esc(it.Name)}</span><span class="cp" style="background:${esc(it.Default || "#fff")}"></span></div>`;
    if (it.kind === "Input") return `<div class="row"><span>${esc(it.Name)}</span><span class="dd" style="color:#666">${esc(it.Placeholder || "...")}</span></div>`;
    if (it.kind === "Label") return `<div class="row" style="color:#98989f">${esc(it.Text)}</div>`;
    if (it.kind === "PlayerList") return `<div class="row" style="color:#98989f">Player list · avatars, distance, actions</div>`;
    return "";
  };
  pv.innerHTML = `<div class="side"><div class="bt"><img src="assets/logo.png" alt="">${esc(st.title)}</div>${tabs}</div>
    <div class="main"><div class="head">${esc(t ? t.name : "")}</div><div class="cols">${t ? t.sections.map(s => `<div class="sec ${s.side === "Full" ? "full" : ""}"><b>${esc(s.name.toUpperCase())}${s.toggle ? " ☑" : ""}</b>${s.items.map(item).join("")}</div>`).join("") : ""}</div></div>`;
  pv.querySelectorAll(".tb").forEach(b => (b.onclick = () => { tabView = +b.dataset.i; preview(); }));
}
function code() {
  const L = [];
  L.push(`local Proximity = loadstring(game:HttpGet("https://raw.githubusercontent.com/ProximityDevProject/ProximityGUI/main/dist/Proximity.luau"))()`, "");
  L.push(`local Window = Proximity:Window({`, `    Title = ${lua(st.title)},`, `    Keybind = ${lua(st.key)},`);
  if (st.keySystem) L.push(`    KeySystem = { Keys = { "change-me" }, GetKey = "https://your.site/key" },`);
  L.push(`})`, "");
  if (st.home) L.push(`Window:Home()`, "");
  st.tabs.forEach((t, ti) => {
    const tv = "Tab" + (ti + 1);
    L.push(`local ${tv} = Window:Tab({ Name = ${lua(t.name)}, Icon = ${lua(t.icon || "layers")} })`);
    t.sections.forEach((s, si) => {
      const sv = tv + "Section" + (si + 1);
      const extra = (s.side && s.side !== "Left" ? `, Side = ${lua(s.side)}` : "") + (s.toggle ? `, Toggle = true, Flag = ${lua((t.name + "." + s.name).toLowerCase().replace(/\s+/g, ""))}` : "");
      L.push(`local ${sv} = ${tv}:Section({ Name = ${lua(s.name)}${extra} })`);
      s.items.forEach(it => {
        const o = [];
        for (const spec of KINDS[it.kind].f) {
          const [k, type] = spec.split(":"); const v = it[k];
          if (v === undefined || v === "" || k === "Keybind") continue;
          if (k === "Values") o.push(`Values = { ${String(v).split(",").map(x => lua(x.trim())).filter(x => x !== '""').join(", ")} }`);
          else if (k === "Default" && it.kind === "ColorPicker") o.push(`Default = ${lua(v)}`);
          else if (type === "num") o.push(`${k} = ${Number(v)}`);
          else if (type === "bool") { if (v) o.push(`${k} = true`); }
          else o.push(`${k} = ${lua(v)}`);
        }
        if (it.kind === "Button") o.push(`Callback = function() end`);
        else if (["Toggle", "Slider", "Dropdown", "Input", "ColorPicker"].includes(it.kind)) o.push(`Callback = function(value) end`);
        let line = `${sv}:${it.kind}({ ${o.join(", ")} })`;
        if (it.kind === "Toggle" && it.Keybind) line += `\n    :Keybind({ Default = ${lua(it.Keybind)}, Mode = "Toggle" })`;
        L.push(line);
      });
      L.push("");
    });
  });
  if (st.settings) L.push(`Window:SettingsTab()`);
  const text = L.join("\n");
  const c = document.getElementById("code"); c.textContent = text; c.innerHTML = proximityHighlight(text);
  return text;
}
function render() { tree(); adds(); form(); preview(); code(); save(); }
document.getElementById("copy").onclick = e => proximityCopy(code(), e.target);
let armed = false;
document.getElementById("reset").onclick = e => { if (!armed) { armed = true; e.target.textContent = "Sure?"; setTimeout(() => { armed = false; e.target.textContent = "Start over"; }, 2500); return; } st = fresh(); sel = { t: 0, s: 0, i: -1 }; tabView = 0; render(); };
render();
</script>
</body>
</html>
