<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Proximity UI">
  <defs>
    <radialGradient id="body" cx="68%" cy="30%" r="80%">
      <stop offset="0" stop-color="#2c2c33"/>
      <stop offset="0.45" stop-color="#0e0e12"/>
      <stop offset="1" stop-color="#040405"/>
    </radialGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050506"/>
      <stop offset="1" stop-color="#050506" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="planetClip"><circle cx="930" cy="210" r="132"/></clipPath>
    <clipPath id="front"><rect x="600" y="210" width="680" height="220"/></clipPath>
  </defs>
  <rect width="1280" height="420" rx="22" fill="#050506"/>
  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="60" r="1.2" opacity=".5"><animate attributeName="opacity" values=".15;.7;.15" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="350" r="1" opacity=".4"><animate attributeName="opacity" values=".6;.1;.6" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="44" r="1.4" opacity=".5"><animate attributeName="opacity" values=".2;.8;.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="380" r="1" opacity=".35"/>
    <circle cx="760" cy="70" r="1.1" opacity=".5"><animate attributeName="opacity" values=".1;.6;.1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1180" cy="90" r="1.3" opacity=".55"><animate attributeName="opacity" values=".7;.2;.7" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="1230" cy="330" r="1" opacity=".4"/>
    <circle cx="1120" cy="390" r="1.2" opacity=".45"><animate attributeName="opacity" values=".2;.7;.2" dur="5.4s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="300" r="1" opacity=".3"/>
    <circle cx="1040" cy="30" r="1" opacity=".4"/>
  </g>
  <circle cx="930" cy="210" r="260" fill="url(#glow)"/>
  <!-- ring, back half -->
  <g transform="rotate(-17 930 210)">
    <ellipse cx="930" cy="210" rx="250" ry="52" fill="none" stroke="url(#ring)" stroke-width="10" opacity=".35"/>
    <ellipse cx="930" cy="210" rx="222" ry="46" fill="none" stroke="url(#ring)" stroke-width="16" opacity=".55"/>
    <ellipse cx="930" cy="210" rx="196" ry="40" fill="none" stroke="url(#ring)" stroke-width="5" opacity=".3"/>
  </g>
  <!-- planet -->
  <circle cx="930" cy="210" r="132" fill="url(#body)"/>
  <g clip-path="url(#planetClip)" opacity=".9">
    <rect x="790" y="150" width="280" height="10" fill="url(#belt)"/>
    <rect x="790" y="182" width="280" height="16" fill="url(#belt)"/>
    <rect x="790" y="230" width="280" height="8" fill="url(#belt)"/>
    <rect x="790" y="262" width="280" height="14" fill="url(#belt)"/>
  </g>
  <path d="M1012 106 A132 132 0 0 1 1035 290" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" opacity=".95"/>
  <circle cx="1012" cy="106" r="5" fill="#ffffff"><animate attributeName="r" values="4;6.5;4" dur="2.6s" repeatCount="indefinite"/></circle>
  <rect x="900" y="105" width="230" height="1.5" fill="#ffffff" opacity=".55"/>
  <!-- ring, front half -->
  <g transform="rotate(-17 930 210)" clip-path="url(#front)">
    <ellipse cx="930" cy="210" rx="250" ry="52" fill="none" stroke="url(#ring)" stroke-width="10" opacity=".45"/>
    <ellipse cx="930" cy="210" rx="222" ry="46" fill="none" stroke="url(#ring)" stroke-width="16" opacity=".75"/>
    <ellipse cx="930" cy="210" rx="196" ry="40" fill="none" stroke="url(#ring)" stroke-width="5" opacity=".4"/>
    <circle r="3.4" fill="#ffffff">
      <animateMotion dur="7s" repeatCount="indefinite" path="M1152 210 A222 46 0 1 1 708 210 A222 46 0 1 1 1152 210"/>
    </circle>
  </g>
  <rect x="0" y="0" width="760" height="420" fill="url(#fade)" opacity=".85"/>
  <!-- words -->
  <text x="80" y="176" fill="#ffffff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="-2">Proximity UI</text>
  <text x="82" y="226" fill="#a3a3ac" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24">A black and white interface library for Roblox scripts</text>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#d6d6dc">
    <rect x="82" y="262" width="158" height="34" rx="17" fill="none" stroke="#2f2f37"/>
    <text x="102" y="284">7 loading screens</text>
    <rect x="250" y="262" width="178" height="34" rx="17" fill="none" stroke="#2f2f37"/>
    <text x="270" y="284">12 menu animations</text>
    <rect x="438" y="262" width="122" height="34" rx="17" fill="none" stroke="#2f2f37"/>
    <text x="458" y="284">86 icons</text>
  </g>
  <text x="82" y="352" fill="#66666f" font-family="Consolas, Menlo, monospace" font-size="15">loadstring(game:HttpGet("https://proximitydevproject.github.io/ProximityGUI/Proximity.lua"))()</text>
</svg>
