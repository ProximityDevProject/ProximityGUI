name: Bug report
description: Something does not work or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report from the menu
      description: Settings > Output > Copy report, then paste here.
      render: text
  - type: input
    id: executor
    attributes:
      label: Executor and device
      placeholder: Potassium, Windows 11
  - type: textarea
    id: code
    attributes:
      label: Smallest script that shows it
      render: lua
