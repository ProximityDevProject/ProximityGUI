name: Executor history
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: executor-history
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - name: Check out the data branch
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" data; then
            git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
          else
            mkdir data && cd data && git init -b data
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          fi
      - name: Take a snapshot
        run: python main/.github/scripts/executors.py data/executors-history.json
      - name: Commit
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add executors-history.json
          git commit -m "Executor snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push origin data
