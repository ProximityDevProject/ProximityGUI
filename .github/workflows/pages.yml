name: Deploy site
on:
  push:
    branches: [main]
    paths: ["site/**", "dist/**", "VERSION", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Put the script on the site
        run: |
          cp dist/Proximity.luau site/Proximity.lua
          mkdir -p site/v
          cp dist/v/*.luau site/v/ 2>/dev/null || true
          for f in site/v/*.luau; do cp "$f" "${f%.luau}.lua"; done
          cp VERSION site/VERSION
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
